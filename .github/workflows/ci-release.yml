name: CI and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate RFPY
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check packaging

      - name: Verify embedded installer payloads
        shell: pwsh
        run: |
          python tools/embed_payloads.py
          git diff --ignore-space-at-eol --exit-code -- installer/rfpy-installer.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "installer/rfpy-installer.ps1 contains stale embedded payloads. Run: python tools/embed_payloads.py"
          }

      - name: Compile Python source
        shell: pwsh
        run: python -W error -m py_compile src/rfpy.py

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @('src/wrappers/rfpy.ps1', 'src/wrappers/uv.ps1', 'installer/rfpy-installer.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parser errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  build_main_artifact:
    name: Build Windows artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check packaging
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force
          Get-Command Invoke-ps2exe -ErrorAction Stop | Format-List Name,Source,Version

      - name: Refresh embedded payloads
        shell: pwsh
        run: python tools/embed_payloads.py

      - name: Read source version
        id: version
        shell: pwsh
        run: |
          $source = Get-Content -Raw -Encoding UTF8 .\src\rfpy.py
          if ($source -notmatch 'APP_VERSION\s*=\s*"(?<version>\d+\.\d+\.\d+)"') {
            throw 'Unable to read APP_VERSION from src/rfpy.py'
          }
          $version = $Matches.version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building RFPY $version from main."

      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\dist -Force | Out-Null
          $version = '${{ steps.version.outputs.version }}'
          Invoke-ps2exe `
            .\installer\rfpy-installer.ps1 `
            .\dist\RFPY-Setup.exe `
            -x64 `
            -title 'RFPY Installer' `
            -product 'RFPY' `
            -version "$version.0" `
            -iconFile .\assets\rfpy.ico

          if (-not (Test-Path .\dist\RFPY-Setup.exe)) {
            throw 'RFPY-Setup.exe was not produced.'
          }

          $hash = (Get-FileHash .\dist\RFPY-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RFPY-Setup.exe" | Set-Content -Path .\dist\RFPY-Setup.exe.sha256 -Encoding Ascii

      - name: Upload main workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: RFPY-${{ steps.version.outputs.version }}-windows-main
          path: |
            dist/RFPY-Setup.exe
            dist/RFPY-Setup.exe.sha256
          retention-days: 14

  release:
    name: Build GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check packaging
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force
          Get-Command Invoke-ps2exe -ErrorAction Stop | Format-List Name,Source,Version

      - name: Refresh embedded payloads and validate
        shell: pwsh
        run: |
          python tools/embed_payloads.py
          python -W error -m py_compile src/rfpy.py
          python -m unittest discover -s tests -q

      - name: Check tag and source version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, got: $tag"
          }
          $version = $Matches.version
          $source = Get-Content -Raw -Encoding UTF8 .\src\rfpy.py
          if ($source -notmatch ('APP_VERSION\s*=\s*"' + [regex]::Escape($version) + '"')) {
            throw "Tag $tag does not match APP_VERSION in src/rfpy.py"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\dist -Force | Out-Null
          $version = '${{ steps.version.outputs.version }}'
          Invoke-ps2exe `
            .\installer\rfpy-installer.ps1 `
            .\dist\RFPY-Setup.exe `
            -x64 `
            -title 'RFPY Installer' `
            -product 'RFPY' `
            -version "$version.0" `
            -iconFile .\assets\rfpy.ico
          if (-not (Test-Path .\dist\RFPY-Setup.exe)) {
            throw 'RFPY-Setup.exe was not produced.'
          }

          $hash = (Get-FileHash .\dist\RFPY-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RFPY-Setup.exe" | Set-Content -Path .\dist\RFPY-Setup.exe.sha256 -Encoding Ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: RFPY-${{ steps.version.outputs.version }}-windows
          path: |
            dist/RFPY-Setup.exe
            dist/RFPY-Setup.exe.sha256

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.version.outputs.version }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag .\dist\RFPY-Setup.exe .\dist\RFPY-Setup.exe.sha256 --clobber
          } else {
            gh release create $tag `
              .\dist\RFPY-Setup.exe `
              .\dist\RFPY-Setup.exe.sha256 `
              --title "RFPY $version" `
              --generate-notes
          }
